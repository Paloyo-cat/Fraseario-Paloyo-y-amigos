<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fraseario de Paloyo y amigos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #111116;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      max-width: 950px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 12px;
    }

    #contador {
      text-align: center;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .controles {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #aleatoria {
      display: none;
      background: #25252d;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      font-size: 22px;
    }

    .frase {
      background: #1c1c22;
      padding: 17px;
      margin-bottom: 10px;
      border-radius: 9px;
      font-size: 18px;
    }

    .numero {
      font-weight: bold;
      color: #aaa;
      margin-right: 12px;
    }

    .texto-frase {
      color: #eee;
    }

    .autor {
      font-weight: bold;
      margin-left: 8px;
    }

    @media (max-width: 600px) {
      .controles {
        flex-direction: column;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>📜 Fraseario de Paloyo y amigos</h1>

    <div class="subtitulo">
      Grandes frases dichas en directo que probablemente era mejor no recordar
    </div>

    <div id="contador">
      Cargando frases...
    </div>

    <div class="controles">

      <input
        id="buscar"
        type="text"
        placeholder="🔎 Buscar frase, autor o año..."
      >

      <button onclick="fraseAleatoria()">
        🎲 Frase aleatoria
      </button>

    </div>

    <div id="aleatoria"></div>

    <div id="lista"></div>

  </div>


  <script>

    let frases = [];

    fetch("frases.txt")
      .then(respuesta => respuesta.text())
      .then(texto => {

        const lineas = texto
          .split(/\r?\n/)
          .map(linea => linea.trim())
          .filter(linea =>
            linea.length > 0 &&
            linea !== "#"
          );

        frases = lineas.map((linea, indice) => {

          const partes = linea.split("|");

          let frase = "";
          let autor = "";
          let anio = "";

          if (partes.length >= 3) {

            frase = partes[0].trim();
            autor = partes[1].trim();
            anio = partes[2].trim();

          } else if (partes.length === 2) {

            frase = partes[0].trim();
            autor = partes[1].trim();

          } else {

            frase = linea.trim();

          }

          return {
            numero: indice + 1,
            frase: frase,
            autor: autor,
            anio: anio
          };

        });

        document.getElementById("contador").innerText =
          "🎙️ " + frases.length + " frases guardadas";

        mostrarFrases(frases);

      });


    function mostrarFrases(lista) {

      const contenedor =
        document.getElementById("lista");

      contenedor.innerHTML = "";

      lista.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "frase";


        const spanNumero =
          document.createElement("span");

        spanNumero.className = "numero";
        spanNumero.textContent =
          "#" + item.numero;


        const spanFrase =
          document.createElement("span");

        spanFrase.className =
          "texto-frase";

        spanFrase.textContent =
          "“" + item.frase + "”";


        div.appendChild(spanNumero);
        div.appendChild(spanFrase);


        if (item.autor !== "") {

          const spanAutor =
            document.createElement("span");

          spanAutor.className =
            "autor";

          spanAutor.textContent =
            " - " +
            item.autor +
            (item.anio !== ""
              ? " " + item.anio
              : "");

          div.appendChild(spanAutor);

        }


        contenedor.appendChild(div);

      });

    }


    document
      .getElementById("buscar")
      .addEventListener("input", function() {

        const texto =
          this.value
            .toLowerCase()
            .trim();

        const resultado =
          frases.filter(item =>

            item.frase
              .toLowerCase()
              .includes(texto)

            ||

            item.autor
              .toLowerCase()
              .includes(texto)

            ||

            item.anio
              .toLowerCase()
              .includes(texto)

          );

        mostrarFrases(resultado);

      });


    function fraseAleatoria() {

      if (frases.length === 0) {
        return;
      }

      const indice =
        Math.floor(
          Math.random() *
          frases.length
        );

      const item =
        frases[indice];

      const caja =
        document.getElementById(
          "aleatoria"
        );

      caja.style.display =
        "block";


      let texto =
        "🎲 #" +
        item.numero +
        " “" +
        item.frase +
        "”";


      if (item.autor !== "") {

        texto +=
          " - " +
          item.autor;

      }


      if (item.anio !== "") {

        texto +=
          " " +
          item.anio;

      }


      caja.textContent =
        texto;

    }

  </script>

</body>
</html>
